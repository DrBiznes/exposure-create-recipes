plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.53'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

// Compile for Java 17 (what Minecraft 1.20.1 runs on) regardless of which JDK runs Gradle (17 or newer).
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    maven { url = 'https://maven.createmod.net' }       // Create
    maven { url = 'https://maven.ithundxr.dev/mirror' } // Registrate (Create runtime)
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // We only extend Create's SequencedAssemblyItem, so the slim jar is enough to compile against.
    // Class names are Mojang-named even in the SRG jar, and we override nothing, so no deobf needed.
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
            mod_authors: mod_authors, mod_description: mod_description,
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range, loader_version_range: loader_version_range,
            create_version_range: create_version_range, exposure_version_range: exposure_version_range,
    ]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}

tasks.named('jar', Jar).configure {
    manifest.attributes(
            'Specification-Title': mod_name,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': mod_authors
    )
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
