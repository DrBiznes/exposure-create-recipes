plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://maven.createmod.net' } // Create
}

dependencies {
    // We only extend Create's SequencedAssemblyItem, so the slim jar is enough to compile against.
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
            mod_authors: mod_authors, mod_description: mod_description,
            minecraft_version_range: minecraft_version_range,
            neoforge_version_range: neoforge_version_range, loader_version_range: loader_version_range,
            create_version_range: create_version_range, exposure_version_range: exposure_version_range,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
